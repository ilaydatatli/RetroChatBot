# Her push'ta ve pull request'te testleri GitHub'ın sunucusunda çalıştırır.
# Sonuç GitHub'daki "Actions" sekmesinde ve commit'lerin yanındaki ✓ / ✗ işaretinde görünür.
name: Testler

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest
